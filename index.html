<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Top Games Today</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#000;
    color:#fff;
    padding:20px;
}

h1{
    text-align:center;
    font-size:30px;
    margin-bottom:20px;
}

#games{
    display:flex;
    flex-direction:column;
    gap:12px;
    max-width:900px;
    margin:auto;
}

.game-card{
    background:#111;
    border:1px solid #1f1f1f;
    border-radius:16px;
    padding:14px;
    display:flex;
    align-items:center;
    gap:14px;
}

.rank{
    width:40px;
    text-align:center;
    font-size:22px;
    font-weight:700;
}

.thumbnail{
    width:80px;
    height:80px;
    border-radius:12px;
    object-fit:cover;
    background:#222;
}

.game-info{
    flex:1;
}

.game-name{
    font-size:20px;
    font-weight:700;
    margin-bottom:5px;
}

.time-played{
    font-size:15px;
    color:#bbb;
}

@media(max-width:600px){
    .thumbnail{ width:65px; height:65px; }
    .game-name{ font-size:18px; }
    .time-played{ font-size:13px; }
    .rank{ font-size:20px; }
}
</style>
</head>

<body>

<h1>Top Games Today</h1>
<div id="games"></div>

<script>

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRo-SarpignS39lDSaIGsV13WyUJOURcyVaRP_mEqY6XfBxby9WA_XCf5AhXi8OcwHDiP4FLqBwMGKw/pub?gid=363986867&single=true&output=csv";

function parseCSV(text){
    return text
        .split("\n")
        .map(r => r.split(",").map(c => c.replace(/"/g,"").trim()));
}

function isToday(date){
    const now = new Date();
    return date.getDate() === now.getDate() &&
           date.getMonth() === now.getMonth() &&
           date.getFullYear() === now.getFullYear();
}

async function loadGames(){

    const res = await fetch(CSV_URL);
    const text = await res.text();

    const rows = parseCSV(text).slice(1);

    const games = {};

    for(const r of rows){

        const universeId = r[0];
        const name = r[1];
        const minutes = Number(r[2]) || 0;
        const start = r[3];

        if(!universeId || !name || !start) continue;

        const date = new Date(start);
        if(isNaN(date) || !isToday(date)) continue;

        if(!games[universeId]){
            games[universeId] = { name, minutes: 0 };
        }

        games[universeId].minutes += minutes;
    }

    const sorted = Object.entries(games)
        .sort((a,b)=>b[1].minutes-a[1].minutes);

    const container = document.getElementById("games");
    container.innerHTML = "";

    // ---- BATCH THUMBNAILS ----
    const ids = sorted.map(x => x[0]).join(",");

    let thumbnails = {};

    if(ids){

        try{
            const thumbRes = await fetch(
                `https://thumbnails.roblox.com/v1/games/icons?universeIds=${ids}&size=256x256&format=Png&isCircular=false`
            );

            const thumbData = await thumbRes.json();

            if (thumbData && Array.isArray(thumbData.data)) {
                for (const t of thumbData.data) {

                    const id =
                        t.targetId ||
                        t.universeId ||
                        t.requestId ||
                        t.id;

                    if (id && t.imageUrl) {
                        thumbnails[id] = t.imageUrl;
                    }
                }
            }

        } catch(e){
            console.log("Thumbnail error:", e);
        }
    }

    // ---- RENDER ----
    for(let i=0;i<sorted.length;i++){

        const [id, g] = sorted[i];

        const h = Math.floor(g.minutes / 60);
        const m = g.minutes % 60;

        const img =
            thumbnails[id] ||
            "https://tr.rbxcdn.com/0b7f2c1c1c0b3b7f0c1c1c0b3b7f0c1c/150/150/Image/Png";

        const card = document.createElement("div");
        card.className = "game-card";

        card.innerHTML = `
            <div class="rank">#${i+1}</div>
            <img class="thumbnail" src="${img}">
            <div class="game-info">
                <div class="game-name">${g.name}</div>
                <div class="time-played">${h}h ${m}m played</div>
            </div>
        `;

        container.appendChild(card);
    }
}

loadGames();
setInterval(loadGames, 60000);

</script>

</body>
</html>
