<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Dashboard</title>

<style>
body{
  background:#000;
  color:#fff;
  font-family:Arial;
  padding:20px;
}

h1{
  text-align:center;
  margin-bottom:10px;
}

/* TOP SPOTLIGHT */
.top{
  background:#111;
  padding:15px;
  border-radius:15px;
  text-align:center;
  margin-bottom:20px;
}

.top img{
  width:140px;
  height:140px;
  border-radius:15px;
  margin-top:10px;
  object-fit:cover;
}

/* LIST */
.card{
  display:flex;
  align-items:center;
  gap:12px;
  background:#111;
  padding:12px;
  margin:10px 0;
  border-radius:12px;
}

.rank{
  width:40px;
  font-weight:bold;
}

img{
  width:70px;
  height:70px;
  border-radius:10px;
  object-fit:cover;
  background:#222;
}

.info{
  flex:1;
}

.bar{
  height:6px;
  background:#222;
  border-radius:5px;
  overflow:hidden;
  margin-top:6px;
}

.fill{
  height:100%;
  background:#4da3ff;
  transition: width 0.4s ease;
}
</style>
</head>

<body>

<h1>🔥 Top Games Today</h1>

<div id="top"></div>
<div id="games">Loading...</div>

<script>

const API = "https://script.google.com/macros/s/AKfycby5tKKny4hqGyG--JQxP4IVe2C8WWGO6sMij6p66MdSmLFVDUn6TbeBbM2L51TdWia_/exec";

async function load(){

  const res = await fetch(API);
  const data = await res.json();

  if(!data || data.length === 0){
    document.getElementById("games").innerHTML = "No data yet.";
    return;
  }

  const max = data[0].minutes;

  // 🏆 TOP GAME
  const top = data[0];
  document.getElementById("top").innerHTML = `
    <div class="top">
      <h2>🏆 Top Game</h2>
      <b>${top.name}</b><br>
      ${Math.floor(top.minutes/60)}h ${top.minutes%60}m<br>
      <img src="${top.image}">
    </div>
  `;

  // 📊 LIST
  const box = document.getElementById("games");
  box.innerHTML = "";

  data.forEach((g,i)=>{

    const percent = (g.minutes / max) * 100;

    box.innerHTML += `
      <div class="card">
        <div class="rank">#${i+1}</div>

        <img src="${g.image}">

        <div class="info">
          <b>${g.name}</b><br>
          ${Math.floor(g.minutes/60)}h ${g.minutes%60}m

          <div class="bar">
            <div class="fill" style="width:${percent}%"></div>
          </div>
        </div>
      </div>
    `;
  });
}

load();
setInterval(load, 60000);

</script>

</body>
</html>
