<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Top Games Todayy</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#000;
    color:#fff;
    padding:20px;
}

h1{
    text-align:center;
    font-size:30px;
    margin-bottom:20px;
}

#games{
    display:flex;
    flex-direction:column;
    gap:12px;
    max-width:900px;
    margin:auto;
}

.card{
    display:flex;
    align-items:center;
    gap:14px;
    background:#111;
    border:1px solid #1f1f1f;
    border-radius:16px;
    padding:14px;
}

.rank{
    width:40px;
    font-size:22px;
    font-weight:700;
    text-align:center;
}

img{
    width:80px;
    height:80px;
    border-radius:12px;
    object-fit:cover;
    background:#222;
}

.info{
    flex:1;
}

.name{
    font-size:20px;
    font-weight:700;
    margin-bottom:5px;
}

.time{
    font-size:15px;
    color:#bbb;
}

@media(max-width:600px){
    img{ width:65px; height:65px; }
    .name{ font-size:18px; }
    .time{ font-size:13px; }
    .rank{ font-size:20px; }
}
</style>
</head>

<body>

<h1>Top Games Today</h1>
<div id="games"></div>

<script>

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRo-SarpignS39lDSaIGsV13WyUJOURcyVaRP_mEqY6XfBxby9WA_XCf5AhXi8OcwHDiP4FLqBwMGKw/pub?gid=363986867&single=true&output=csv";

function parseCSV(text){
    return text
        .trim()
        .split("\n")
        .map(line =>
            line.split(",").map(x => x.replace(/"/g,"").trim())
        );
}

function isToday(date){
    const now = new Date();
    return date.getDate() === now.getDate() &&
           date.getMonth() === now.getMonth() &&
           date.getFullYear() === now.getFullYear();
}

async function loadGames(){

    const res = await fetch(CSV_URL);
    const text = await res.text();

    const rows = parseCSV(text).slice(1);

    const games = {};

    for(const r of rows){

        const id = r[0];       // universe id
        const name = r[1];     // game name
        const mins = Number(r[2]) || 0;
        const start = new Date(r[3]);

        if(!id || !name || isNaN(start)) continue;
        if(!isToday(start)) continue;

        if(!games[id]){
            games[id] = {
                name,
                mins: 0
            };
        }

        games[id].mins += mins;
    }

    const sorted = Object.entries(games)
        .sort((a,b)=>b[1].mins - a[1].mins);

    const box = document.getElementById("games");
    box.innerHTML = "";

    sorted.forEach(([id,g],i)=>{

        const h = Math.floor(g.mins / 60);
        const m = g.mins % 60;

        const img =
        `https://thumbnails.roblox.com/v1/games/icons?universeIds=${id}&returnPolicy=PlaceHolder&size=512x512&format=Png&isCircular=false`;

        box.innerHTML += `
        <div class="card">
            <div class="rank">#${i+1}</div>
            <img src="${img}">
            <div class="info">
                <div class="name">${g.name}</div>
                <div class="time">${h}h ${m}m played today</div>
            </div>
        </div>
        `;
    });
}

loadGames();
setInterval(loadGames, 60000);

</script>

</body>
</html>
