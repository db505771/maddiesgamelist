<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Games Today</title>

<style>
body{background:#000;color:#fff;font-family:Arial;padding:20px}
h1{text-align:center}
.card{display:flex;gap:12px;align-items:center;background:#111;padding:12px;margin:10px 0;border-radius:12px}
img{width:70px;height:70px;border-radius:10px}
.rank{width:40px;font-weight:bold}
.small{color:#aaa}
</style>
</head>

<body>

<h1>Top Games Today</h1>
<div id="games"></div>

<script>

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRo-SarpignS39lDSaIGsV13WyUJOURcyVaRP_mEqY6XfBxby9WA_XCf5AhXi8OcwHDiP4FLqBwMGKw/pub?gid=363986867&single=true&output=csv";

function parseCSV(text){
    return text.trim().split("\n").map(line =>
        (line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g) || [])
        .map(x => x.replace(/"/g,"").trim())
    );
}

function isToday(d){
    const n = new Date();
    return d.getDate()==n.getDate() &&
           d.getMonth()==n.getMonth() &&
           d.getFullYear()==n.getFullYear();
}

async function load(){

    const res = await fetch(CSV_URL);
    const text = await res.text();

    const rows = parseCSV(text).slice(1);

    const games = {};

    for(const r of rows){

        const id = r[0];
        const name = r[1];
        const mins = Number(r[2])||0;
        const start = new Date(r[3]);

        if(!id || !name || isNaN(start)) continue;
        if(!isToday(start)) continue;

        if(!games[id]){
            games[id]={name,mins:0};
        }

        games[id].mins += mins;
    }

    const sorted = Object.entries(games)
        .sort((a,b)=>b[1].mins-a[1].mins);

    const box = document.getElementById("games");
    box.innerHTML="";

    sorted.forEach(([id,g],i)=>{

        const h=Math.floor(g.mins/60);
        const m=g.mins%60;

        const img=`https://thumbnails.roblox.com/v1/games/icons?universeIds=${id}&size=256x256&format=Png&isCircular=false`;

        box.innerHTML += `
        <div class="card">
            <div class="rank">#${i+1}</div>
            <img src="${img}">
            <div>
                <div><b>${g.name}</b></div>
                <div class="small">${h}h ${m}m</div>
            </div>
        </div>`;
    });
}

load();
setInterval(load,60000);

</script>

</body>
</html>
