<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Dashboard</title>

<style>
body{
  background:#000;
  color:#fff;
  font-family:Arial;
  padding:20px;
}

h1{
  text-align:center;
}

/* FILTER BAR */
.filters{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:15px;
}

button{
  background:#111;
  color:#fff;
  border:1px solid #333;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
}

button.active{
  background:#4da3ff;
  border:none;
}

/* LIST */
.card{
  display:flex;
  align-items:center;
  gap:12px;
  background:#111;
  padding:12px;
  margin:10px 0;
  border-radius:12px;
}

.rank{
  width:40px;
  font-weight:bold;
}

img{
  width:70px;
  height:70px;
  border-radius:10px;
  object-fit:cover;
  background:#222;
}

.info{
  flex:1;
}
</style>
</head>

<body>

<h1>Top games played</h1>

<div class="filters">
  <button onclick="setFilter('day')" class="active">Day</button>
  <button onclick="setFilter('week')">Week</button>
  <button onclick="setFilter('month')">Month</button>
</div>

<div id="games">...</div>

<script>

const API = "https://script.google.com/macros/s/AKfycby5tKKny4hqGyG--JQxP4IVe2C8WWGO6sMij6p66MdSmLFVDUn6TbeBbM2L51TdWia_/exec";

let cache = [];
let currentFilter = "day";

// ⚡ INSTANT LOAD (cache first)
if(localStorage.getItem("games_cache")){
  cache = JSON.parse(localStorage.getItem("games_cache"));
  render();
}

async function load(){

  const res = await fetch(API);
  cache = await res.json();

  localStorage.setItem("games_cache", JSON.stringify(cache));

  render();
}

function setFilter(type){
  currentFilter = type;

  document.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
  event.target.classList.add("active");

  render();
}

function filterData(data){

  const now = new Date();

  return data.filter(g=>{

    const d = new Date(g.date || now);

    if(currentFilter === "day"){
      return true;
    }

    if(currentFilter === "week"){
      const diff = (now - d) / (1000*60*60*24);
      return diff <= 7;
    }

    if(currentFilter === "month"){
      const diff = (now - d) / (1000*60*60*24);
      return diff <= 30;
    }

    return true;
  });
}

function render(){

  const data = filterData(cache);

  const box = document.getElementById("games");

  if(!data || data.length === 0){
    box.innerHTML = "No data.";
    return;
  }

  box.innerHTML = "";

  data.forEach((g,i)=>{

    box.innerHTML += `
      <div class="card">
        <div class="rank">#${i+1}</div>

        <img src="${g.image}">

        <div class="info">
          <b>${g.name}</b><br>
          ${Math.floor(g.minutes/60)}h ${g.minutes%60}m
        </div>
      </div>
    `;
  });
}

load();
setInterval(load, 60000);

</script>

</body>
</html>
