<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Game Dashboard</title>

<style>

body{
  background:#000000;
  color:white;
  font-family:Arial;
  padding:20px;
  margin:0;
}

h1{
  text-align:center;
  margin-bottom:20px;
}

/* FILTER BUTTONS */

.filters{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

button{
  background:#111;
  color:white;
  border:none;
  padding:10px 16px;
  border-radius:10px;
  font-size:15px;
  cursor:pointer;
}

button.active{
  background:white;
  color:black;
}

/* GAME CARD */

.card{
  display:flex;
  align-items:center;
  gap:12px;
  background:#111;
  padding:12px;
  border-radius:14px;
  margin-bottom:12px;
}

.rank{
  font-size:18px;
  font-weight:bold;
  width:40px;
  text-align:center;
}

.gameImage{
  width:72px;
  height:72px;
  border-radius:12px;
  object-fit:cover;
  background:#222;
}

.info{
  flex:1;
}

.gameTitle{
  font-size:17px;
  font-weight:bold;
  margin-bottom:4px;
}

.time{
  color:#aaa;
  font-size:14px;
}

.loading{
  text-align:center;
  color:#888;
  margin-top:30px;
}

</style>
</head>

<body>

<h1>Top Games</h1>

<div class="filters">
  <button class="active" onclick="setFilter('day', this)">Day</button>
  <button onclick="setFilter('week', this)">Week</button>
  <button onclick="setFilter('month', this)">Month</button>
</div>

<div id="games">
  <div class="loading">Loading...</div>
</div>

<script>

const API = "https://script.google.com/macros/s/AKfycby5tKKny4hqGyG--JQxP4IVe2C8WWGO6sMij6p66MdSmLFVDUn6TbeBbM2L51TdWia_/exec";

let gamesData = [];
let currentFilter = "day";

/* ⚡ instant load cache */

const cached = localStorage.getItem("games_cache");

if(cached){
  try{
    gamesData = JSON.parse(cached);
    render();
  }catch(e){}
}

async function fetchData(){

  try{

    const res = await fetch(API);
    const data = await res.json();

    gamesData = data;

    localStorage.setItem(
      "games_cache",
      JSON.stringify(data)
    );

    render();

  }catch(err){

    console.log(err);

    document.getElementById("games").innerHTML =
      `<div class="loading">Failed to load.</div>`;
  }
}

function setFilter(type, btn){

  currentFilter = type;

  document.querySelectorAll("button")
    .forEach(b => b.classList.remove("active"));

  btn.classList.add("active");

  render();
}

function getFilteredData(){

  const now = new Date();

  return gamesData.filter(g => {

    const d = new Date(g.date);

    const diff =
      (now - d) / (1000 * 60 * 60 * 24);

    if(currentFilter === "day"){
      return diff <= 1;
    }

    if(currentFilter === "week"){
      return diff <= 7;
    }

    if(currentFilter === "month"){
      return diff <= 30;
    }

    return true;
  });

}

function render(){

  const box = document.getElementById("games");

  const filtered = getFilteredData();

  if(filtered.length === 0){
    box.innerHTML =
      `<div class="loading">No games found.</div>`;
    return;
  }

  filtered.sort((a,b)=>b.minutes-a.minutes);

  box.innerHTML = "";

  filtered.forEach((g, i) => {

    const hours = Math.floor(g.minutes / 60);
    const mins = g.minutes % 60;

    box.innerHTML += `
      <div class="card">

        <div class="rank">
          #${i+1}
        </div>

        <img
          class="gameImage"
          src="${g.image}"
        >

        <div class="info">

          <div class="gameTitle">
            ${g.name}
          </div>

          <div class="time">
            ${hours}h ${mins}m played
          </div>

        </div>

      </div>
    `;
  });
}

fetchData();

/* auto refresh every minute */

setInterval(fetchData, 60000);

</script>

</body>
</html>
